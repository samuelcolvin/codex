[package]
edition.workspace = true
license.workspace = true
name = "codex-code-mode-monty"
version.workspace = true

[lib]
doctest = false
name = "codex_code_mode_monty"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codex-code-mode-protocol = { workspace = true }
monty-pool = { workspace = true }
